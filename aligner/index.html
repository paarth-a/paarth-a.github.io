<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Video Audio Alignment Toolkit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: radial-gradient(circle at top, #081733 0%, #030711 60%, #01030a 100%);
        color: #f7f9fc;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem 3rem;
      }
      .container {
        width: min(1200px, 100%);
        margin: 0 auto;
        text-align: center;
      }
      h1 {
        font-size: clamp(2rem, 4vw, 3rem);
        margin-bottom: 0.5rem;
      }
      p {
        margin: 0 auto 1.5rem auto;
        max-width: 640px;
        color: rgba(247, 249, 252, 0.8);
        line-height: 1.5;
      }
      iframe {
        width: 100%;
        min-height: 720px;
        border: none;
        border-radius: 18px;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
        background: #050912;
      }
      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        margin-bottom: 1rem;
        color: #8fb4ff;
        text-decoration: none;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      .back-link:hover {
        color: #c6d9ff;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <a class="back-link" href="/">← Back to homepage</a>
      <h1>Video Audio Alignment Toolkit</h1>
      <p>Upload an MP4 clip and generate aligned transcripts/captions via our Hugging Face Space.</p>
      <iframe
        title="Hugging Face Video Audio Alignment Space"
        src="https://hf.space/embed/paarth-a/video-audio-aligment/+/" 
        allow="clipboard-read; clipboard-write"
      ></iframe>
    </div>
  </body>
</html>
