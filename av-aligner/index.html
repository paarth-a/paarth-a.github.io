<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Video Audio Alignment Toolkit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #ffffff;
        color: #111322;
        min-height: 100vh;
        position: relative;
      }
      .av-aligner--fullscreen {
        position: relative;
        min-height: 100vh;
        width: 100%;
        margin: 0;
        padding-top: 56px;
        box-sizing: border-box;
        background: #ffffff;
      }
      .av-aligner--fullscreen iframe {
        border: none;
        width: 100%;
        height: calc(100vh - 56px);
        display: block;
      }
      .av-aligner__back-link {
        position: absolute;
        top: 16px;
        left: 16px;
        padding: 10px 18px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.65);
        color: #f2f2f7;
        text-decoration: none;
        font-size: 0.9rem;
        transition: background 0.2s ease;
        backdrop-filter: blur(6px);
        z-index: 2;
      }
      .av-aligner__back-link:hover {
        background: rgba(255, 255, 255, 0.15);
      }
    </style>
  </head>
  <body>
    <div class="av-aligner--fullscreen">
      <a class="av-aligner__back-link" href="/">← Back to paarth-a.github.io</a>
      <iframe
        src="https://paarth-a-av-alignment.hf.space"
        title="Video Audio Alignment"
        loading="lazy"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen
      ></iframe>
    </div>
  </body>
</html>
